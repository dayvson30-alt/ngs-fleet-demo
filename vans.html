<main id="top">
  <section class="hero">
    <div class="hero-bg bg-vans" id="heroBg"></div>
    <canvas id="bubbles"></canvas>
    <div class="wrap">
      <p class="kicker hero-in" data-i18n="vn_kicker"></p>
      <h1>
        <span class="line"><span data-i18n="vn_l1"></span></span>
        <span class="line"><span data-i18n="vn_l2"></span></span>
        <span class="line"><span data-i18n="vn_l3"></span></span>
      </h1>
      <p class="hero-sub hero-in" data-i18n="vn_sub"></p>
      <div class="hero-ctas hero-in">
        <a href="#plans" class="btn btn-primary magnetic" data-i18n="vn_cta"></a>
        <a href="#" class="btn btn-wa js-wa"><svg width="18" height="18"><use href="#wa"/></svg><span data-i18n="hero_cta2"></span></a>

      </div>
    </div>

  </section>

  <div class="marquee" aria-hidden="true">
    <div class="marquee-track">
      <span>PICKUPS & VANS</span><span>ORLANDO</span><span>INSIDE AND OUT</span><span>KISSIMMEE</span><span>ON-SITE</span><span>DAVENPORT</span><span>PICKUPS & VANS</span><span>ORLANDO</span><span>INSIDE AND OUT</span><span>KISSIMMEE</span><span>ON-SITE</span><span>DAVENPORT</span>

  <section id="ba">
    <div class="wrap">
      <div class="ba-head reveal">
        <div><p class="kicker" data-i18n="ba_kicker"></p><h2 class="h2" data-i18n="ba_title"></h2></div>
        <div class="tabs">
          <button class="on" data-ba="0" data-i18n="ba_tab1"></button>
          <button data-ba="1" data-i18n="ba_tab2"></button>
        </div>
      </div>
      <div class="ba reveal" id="baBox">
        <img class="before" id="baBefore" src="img/p06.jpg" alt="Before">
        <img class="after" id="baAfter" src="img/p19.jpg" alt="After">
        <div class="handle"></div>
        <span class="tag b" data-i18n="ba_before"></span><span class="tag a" data-i18n="ba_after"></span>
      </div>
    </div>
  </section>
  <section id="why">
    <div class="wrap">
      <p class="kicker reveal" data-i18n="vn_why_kicker"></p>
      <h2 class="h2 reveal" data-i18n="vn_why_title"></h2>

        <article class="card reveal"><div class="ico"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17h2l2-6h10l2 6h2M7 17a2 2 0 1 0 4 0M13 17a2 2 0 1 0 4 0M5 11l1-4h12l1 4"/></svg></div><h3 data-i18n="vn_why1_t"></h3><p data-i18n="vn_why1_d"></p></article>
        <article class="card reveal"><div class="ico"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><h3 data-i18n="vn_why2_t"></h3><p data-i18n="vn_why2_d"></p></article>
        <article class="card reveal"><div class="ico"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/></svg></div><h3 data-i18n="vn_why3_t"></h3><p data-i18n="vn_why3_d"></p></article>
        <article class="card reveal"><div class="ico"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H8l-4 4z"/></svg></div><h3 data-i18n="vn_why4_t"></h3><p data-i18n="vn_why4_d"></p></article>
      </div>
    </div>
  </section>
  <section id="work" style="padding-top:0">
    <div class="wrap">
      <p class="kicker reveal" data-i18n="gal_kicker"></p>
      <h2 class="h2 reveal" data-i18n="vn_gal_title"></h2>
      <div class="photo-grid">
        <figure class="reveal"><img src="img/vn01.jpg" alt="Nissan Frontier pickup after wash" loading="lazy" decoding="async"></figure>
        <figure class="reveal"><img src="img/vn02.jpg" alt="Nissan Frontier front after wash" loading="lazy" decoding="async"></figure>
        <figure class="reveal"><img src="img/vn03.jpg" alt="Ford Transit van after wash" loading="lazy" decoding="async"></figure>
        <figure class="reveal"><img src="img/vn04.jpg" alt="Ford Transit cargo van clean" loading="lazy" decoding="async"></figure>
        <figure class="reveal"><img src="img/vn05.jpg" alt="Ford Transit front after wash" loading="lazy" decoding="async"></figure>
        <figure class="reveal"><img src="img/vn06.jpg" alt="Ford Transit cab interior cleaned" loading="lazy" decoding="async"></figure>
        <figure class="reveal"><img src="img/vn07.jpg" alt="Nissan NV200 interior cleaned" loading="lazy" decoding="async"></figure>
        <figure class="reveal"><img src="img/vn08.jpg" alt="Nissan NV200 cab cleaned" loading="lazy" decoding="async"></figure>
        <figure class="reveal"><img src="img/vn09.jpg" alt="Van cab seats and floor cleaned" loading="lazy" decoding="async"></figure>
      </div>
    </div>
  </section>

  <section id="videos" style="padding-top:0">
    <div class="wrap">
      <p class="kicker reveal" data-i18n="vid_kicker"></p>
      <h2 class="h2 reveal" data-i18n="vid_title"></h2>
      <div class="reels">
        <figure class="reel reveal"><video src="video/work-foam-van.mp4" poster="video/work-foam-van.jpg" muted loop playsinline preload="none" aria-label="work-foam-van"></video><figcaption data-i18n="vid_c1"></figcaption></figure>
        <figure class="reel reveal"><video src="video/work-porsche.mp4" poster="video/work-porsche.jpg" muted loop playsinline preload="none" aria-label="work-porsche"></video><figcaption data-i18n="vid_c2"></figcaption></figure>
        <figure class="reel reveal"><video src="video/work-frontier.mp4" poster="video/work-frontier.jpg" muted loop playsinline preload="none" aria-label="work-frontier"></video><figcaption data-i18n="vid_c3"></figcaption></figure>
      </div>
    </div>
  </section>

  <section id="plans" style="padding-top:0">

      <h2 class="h2 reveal" data-i18n="vn_final_title"></h2>

        <input name="car" required data-i18n-ph="f_car">
        <input name="zip" inputmode="numeric" maxlength="10" data-i18n-ph="f_zip" autocomplete="postal-code">
        <button class="btn btn-wa" type="submit"><svg width="18" height="18"><use href="#wa"/></svg><span data-i18n="f_send"></span></button>
      </form>
      <p class="alt-sms reveal"><a href="#" class="btn btn-sms js-sms"><svg width="18" height="18"><use href="#sms"/></svg><span data-i18n="f_sms"></span></a></p>
    </div>
  </section>
