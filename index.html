<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>NGS Car Care · Mobile Fleet Washing in Orlando</title>
  <meta name="description" content="Mobile fleet washing in Orlando and Central Florida. Vans, trucks and cars washed on-site, at night, with a photo report and one monthly invoice.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="48" fill="#0b2a4a" stroke="#3fe0ff" stroke-width="3"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#2f8cff" stroke-width="1.5" stroke-dasharray="2 3"/>
    <text x="50" y="57" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="800" font-size="24" fill="#fff">NGS</text>
    <path d="M28 66 q22 10 44 0" stroke="#3fe0ff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M50 18 c-5 7 -7 10 -7 13 a7 7 0 0 0 14 0 c0-3 -2-6 -7-13z" fill="#3fe0ff"/>
  </symbol>
  <symbol id="wa" viewBox="0 0 24 24"><path fill="currentColor" d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 4.9L2 22l5.2-1.4c1.4.8 3.1 1.2 4.8 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></symbol>
</svg>

<header class="nav" id="nav">
  <div class="wrap">
    <a href="#top" class="brand"><svg><use href="#logo"/></svg>NGS CAR CARE</a>
    <nav class="nav-links">
      <a href="#why" data-i18n="nav_fleet"></a>
      <a href="#how" data-i18n="nav_how"></a>
      <a href="#plans" data-i18n="nav_plans"></a>
    </nav>
    <div class="nav-right">
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en" class="on">EN</button><button data-lang="pt">PT</button><button data-lang="es">ES</button>
      </div>
      <a href="#calc" class="btn btn-primary btn-sm magnetic" data-i18n="nav_quote"></a>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="hero-bg" id="heroBg"></div>
    <canvas id="bubbles"></canvas>
    <div class="wrap">
      <p class="kicker hero-in" data-i18n="hero_kicker"></p>
      <h1>
        <span class="line"><span data-i18n="hero_l1"></span></span>
        <span class="line"><span data-i18n="hero_l2"></span></span>
        <span class="line"><span data-i18n="hero_l3"></span></span>
      </h1>
      <p class="hero-sub hero-in" data-i18n="hero_sub"></p>
      <div class="hero-ctas hero-in">
        <a href="#calc" class="btn btn-primary magnetic" data-i18n="hero_cta"></a>
        <a href="#" class="btn btn-ghost js-wa"><svg width="18" height="18"><use href="#wa"/></svg><span data-i18n="hero_cta2"></span></a>
      </div>
      <div class="stats hero-in">
        <div class="stat"><b><span class="count" data-to="25">0</span>+</b><span data-i18n="stat_1"></span></div>
        <div class="stat"><b><span class="count" data-to="0">0</span></b><span data-i18n="stat_2"></span></div>
        <div class="stat"><b><span class="count" data-to="100">0</span>%</b><span data-i18n="stat_3"></span></div>
      </div>
    </div>
    <div class="scroll-cue" aria-hidden="true"></div>
  </section>

  <div class="marquee" aria-hidden="true">
    <div class="marquee-track">
      <span>MOBILE FLEET WASH</span><span>ORLANDO</span><span>VANS · TRUCKS · CARS</span><span>KISSIMMEE</span><span>NIGHT SERVICE</span><span>DAVENPORT</span>
      <span>MOBILE FLEET WASH</span><span>ORLANDO</span><span>VANS · TRUCKS · CARS</span><span>KISSIMMEE</span><span>NIGHT SERVICE</span><span>DAVENPORT</span>
    </div>
  </div>

  <section id="ba">
    <div class="wrap">
      <div class="ba-head reveal">
        <div><p class="kicker" data-i18n="ba_kicker"></p><h2 class="h2" data-i18n="ba_title"></h2></div>
        <div class="tabs">
          <button class="on" data-ba="0" data-i18n="ba_tab1"></button>
          <button data-ba="1" data-i18n="ba_tab2"></button>
        </div>
      </div>
      <div class="ba reveal" id="baBox">
        <img class="before" id="baBefore" src="img/p06.jpg" alt="Before">
        <img class="after" id="baAfter" src="img/p19.jpg" alt="After">
        <div class="handle"></div>
        <span class="tag b" data-i18n="ba_before"></span><span class="tag a" data-i18n="ba_after"></span>
      </div>
    </div>
  </section>

  <section id="why">
    <div class="wrap">
      <p class="kicker reveal" data-i18n="why_kicker"></p>
      <h2 class="h2 reveal" data-i18n="why_title"></h2>
      <div class="why-grid">
        <article class="card reveal"><div class="ico"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17h2l2-6h10l2 6h2M7 17a2 2 0 1 0 4 0M13 17a2 2 0 1 0 4 0M5 11l1-4h12l1 4"/></svg></div><h3 data-i18n="why1_t"></h3><p data-i18n="why1_d"></p></article>
        <article class="card reveal"><div class="ico"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/></svg></div><h3 data-i18n="why2_t"></h3><p data-i18n="why2_d"></p></article>
        <article class="card reveal"><div class="ico"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="4"/><path d="M8 6l2-3h4l2 3"/></svg></div><h3 data-i18n="why3_t"></h3><p data-i18n="why3_d"></p></article>
        <article class="card reveal"><div class="ico"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg></div><h3 data-i18n="why4_t"></h3><p data-i18n="why4_d"></p></article>
      </div>
    </div>
  </section>

  <section class="fleet" id="fleet">
    <div class="fleet-pin">
      <div class="wrap fleet-head">
        <div><p class="kicker" data-i18n="fleet_kicker"></p><h2 class="h2" data-i18n="fleet_title"></h2></div>
        <p data-i18n="fleet_sub"></p>
      </div>
      <div class="fleet-track" id="fleetTrack">
        <figure class="fleet-item"><img src="img/p22.jpg" alt="Florida Fun Ford Transit van after wash" loading="lazy"><figcaption>Ford Transit · night wash</figcaption></figure>
        <figure class="fleet-item"><img src="img/p24.jpg" alt="Florida Fun cargo van clean" loading="lazy"><figcaption>Cargo van · exterior</figcaption></figure>
        <figure class="fleet-item"><img src="img/p28.jpg" alt="Florida Fun Chevrolet Colorado pickup clean" loading="lazy"><figcaption>Chevy Colorado · work pickup</figcaption></figure>
        <figure class="fleet-item"><img src="img/p27.jpg" alt="Florida Fun van ready for the morning" loading="lazy"><figcaption>Ready by morning</figcaption></figure>
        <figure class="fleet-item"><img src="img/p25.jpg" alt="Van cabin interior cleaned" loading="lazy"><figcaption>Cabin interior</figcaption></figure>
        <figure class="fleet-item"><img src="img/p10.jpg" alt="Cargo area cleaned" loading="lazy"><figcaption>Cargo area · steam clean</figcaption></figure>
      </div>
    </div>
  </section>

  <section id="how">
    <div class="wrap">
      <p class="kicker reveal" data-i18n="how_kicker"></p>
      <h2 class="h2 reveal" data-i18n="how_title"></h2>
      <div class="steps" id="steps">
        <div class="steps-line"><i id="stepsLine"></i></div>
        <div class="step reveal"><div class="num">01</div><h3 data-i18n="how1_t"></h3><p data-i18n="how1_d"></p></div>
        <div class="step reveal"><div class="num">02</div><h3 data-i18n="how2_t"></h3><p data-i18n="how2_d"></p></div>
        <div class="step reveal"><div class="num">03</div><h3 data-i18n="how3_t"></h3><p data-i18n="how3_d"></p></div>
      </div>
    </div>
  </section>

  <section id="plans" style="padding-top:0">
    <div class="wrap">
      <p class="kicker reveal" data-i18n="plans_kicker"></p>
      <h2 class="h2 reveal" data-i18n="plans_title"></h2>
      <div class="plans" id="plansGrid"></div>
    </div>
  </section>

  <section id="calc" style="padding-top:0">
    <div class="wrap">
      <p class="kicker reveal" data-i18n="calc_kicker"></p>
      <h2 class="h2 reveal" data-i18n="calc_title"></h2>
      <div class="calc reveal">
        <div class="calc-in">
          <div class="field">
            <label><span data-i18n="calc_vehicles"></span><b id="vOut">10</b></label>
            <input type="range" id="vIn" min="1" max="100" value="10" aria-label="Vehicles">
          </div>
          <div class="field">
            <label><span data-i18n="calc_service"></span></label>
            <div class="seg" id="svcSeg"></div>
          </div>
          <div class="field" style="margin-bottom:0">
            <label><span data-i18n="calc_freq"></span></label>
            <div class="seg" id="freqSeg">
              <button data-f="4" class="on" data-i18n="freq_w"></button>
              <button data-f="2" data-i18n="freq_b"></button>
              <button data-f="1" data-i18n="freq_m"></button>
            </div>
          </div>
        </div>
        <div class="calc-out">
          <div>
            <p class="kicker" data-i18n="calc_month"></p>
            <div class="total">$<span id="tOut">0</span></div>
          </div>
          <div class="calc-meta">
            <div><b>$<span id="perOut">0</span></b><span data-i18n="calc_per"></span></div>
            <div><b><span id="discOut">0</span>%</b><span data-i18n="calc_disc"></span></div>
          </div>
          <div>
            <a href="#" class="btn btn-primary magnetic" id="calcWa"><svg width="18" height="18"><use href="#wa"/></svg><span data-i18n="calc_cta"></span></a>
            <p class="note" style="margin-top:12px" data-i18n="calc_note"></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="detail" style="padding-top:0">
    <div class="wrap">
      <p class="kicker reveal" data-i18n="detail_kicker"></p>
      <h2 class="h2 reveal" data-i18n="detail_title"></h2>
      <div class="gallery">
        <figure class="reveal"><img src="img/p35.jpg" alt="BMW M340i detailed" loading="lazy"></figure>
        <figure class="reveal"><img src="img/p37.jpg" alt="Leather interior detailed" loading="lazy"></figure>
        <figure class="reveal"><img src="img/p33.jpg" alt="Paint shine after detail" loading="lazy"></figure>
        <figure class="reveal"><img src="img/p31.jpg" alt="Clean leather seats" loading="lazy"></figure>
        <figure class="reveal"><img src="img/p36.jpg" alt="Front of detailed BMW" loading="lazy"></figure>
      </div>
    </div>
  </section>

  <section class="final">
    <div class="wrap">
      <h2 class="h2 reveal" data-i18n="final_title"></h2>
      <p class="reveal" data-i18n="final_sub"></p>
      <form class="form reveal" id="leadForm">
        <input name="name" required data-i18n-ph="f_name" autocomplete="name">
        <input name="company" data-i18n-ph="f_company" autocomplete="organization">
        <input name="vehicles" type="number" min="1" max="999" required data-i18n-ph="f_vehicles">
        <button class="btn btn-primary" type="submit"><svg width="18" height="18"><use href="#wa"/></svg><span data-i18n="f_send"></span></button>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div><a href="#top" class="brand"><svg><use href="#logo"/></svg>NGS CAR CARE</a><p style="margin-top:10px" data-i18n="foot_area"></p></div>
    <div style="text-align:right">
      <p><a href="tel:+13213177254">+1 321-317-7254</a> · <a href="mailto:ngsautocare@gmail.com">ngsautocare@gmail.com</a></p>
      <p data-i18n="foot_lang"></p>
      <p style="margin-top:6px">© <span id="yr"></span> NGS Car Care</p>
    </div>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>

<script src="app.js"></script>
</body>
</html>
