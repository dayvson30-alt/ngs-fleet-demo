<main id="top">
  <section class="hero">
    <div class="hero-bg bg-personal" id="heroBg"></div>
    <canvas id="bubbles"></canvas>
    <div class="wrap">
      <p class="kicker hero-in" data-i18n="pc_kicker"></p>
      <h1>
        <span class="line"><span data-i18n="pc_l1"></span></span>
        <span class="line"><span data-i18n="pc_l2"></span></span>
        <span class="line"><span data-i18n="pc_l3"></span></span>
      </h1>
      <p class="hero-sub hero-in" data-i18n="pc_sub"></p>
      <div class="hero-ctas hero-in">
        <a href="#plans" class="btn btn-primary magnetic" data-i18n="pc_cta"></a>
        <a href="#" class="btn btn-wa js-wa"><svg width="18" height="18"><use href="#wa"/></svg><span data-i18n="hero_cta2"></span></a>
        <a href="#" class="btn btn-sms js-sms"><svg width="18" height="18"><use href="#sms"/></svg><span data-i18n="hero_cta3"></span></a>
      </div>
    </div>
    <div class="scroll-cue" aria-hidden="true"></div>
  </section>

  <div class="marquee" aria-hidden="true">
    <div class="marquee-track">
      <span>MOBILE CAR WASH</span><span>ORLANDO</span><span>AT HOME OR AT WORK</span><span>KISSIMMEE</span><span>YOU PICK THE TIME</span><span>DAVENPORT</span><span>MOBILE CAR WASH</span><span>ORLANDO</span><span>AT HOME OR AT WORK</span><span>KISSIMMEE</span><span>YOU PICK THE TIME</span><span>DAVENPORT</span>
    </div>
  </div>

  <section id="why">
    <div class="wrap">
      <p class="kicker reveal" data-i18n="pc_why_kicker"></p>
      <h2 class="h2 reveal" data-i18n="pc_why_title"></h2>
      <div class="why-grid">
        <article class="card reveal"><div class="ico"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17h2l2-6h10l2 6h2M7 17a2 2 0 1 0 4 0M13 17a2 2 0 1 0 4 0M5 11l1-4h12l1 4"/></svg></div><h3 data-i18n="pc_why1_t"></h3><p data-i18n="pc_why1_d"></p></article>
        <article class="card reveal"><div class="ico"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><h3 data-i18n="pc_why2_t"></h3><p data-i18n="pc_why2_d"></p></article>
        <article class="card reveal"><div class="ico"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/></svg></div><h3 data-i18n="pc_why3_t"></h3><p data-i18n="pc_why3_d"></p></article>
        <article class="card reveal"><div class="ico"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H8l-4 4z"/></svg></div><h3 data-i18n="pc_why4_t"></h3><p data-i18n="pc_why4_d"></p></article>
      </div>
    </div>
  </section>
  <section id="how">
    <div class="wrap">
      <p class="kicker reveal" data-i18n="how_kicker"></p>
      <h2 class="h2 reveal" data-i18n="pc_how_title"></h2>
      <div class="steps" id="steps">
        <div class="steps-line"><i id="stepsLine"></i></div>
        <div class="step reveal"><div class="num">01</div><h3 data-i18n="pc_how1_t"></h3><p data-i18n="pc_how1_d"></p></div>
        <div class="step reveal"><div class="num">02</div><h3 data-i18n="pc_how2_t"></h3><p data-i18n="pc_how2_d"></p></div>
        <div class="step reveal"><div class="num">03</div><h3 data-i18n="pc_how3_t"></h3><p data-i18n="pc_how3_d"></p></div>
      </div>
    </div>
  </section>
  <section id="work" style="padding-top:0">
    <div class="wrap">
      <p class="kicker reveal" data-i18n="gal_kicker"></p>
      <h2 class="h2 reveal" data-i18n="pc_gal_title"></h2>
      <div class="photo-grid">
        <figure class="reveal"><img src="img/pc01.jpg" alt="Tesla Model 3 after wash" loading="lazy" decoding="async"></figure>
        <figure class="reveal"><img src="img/pc02.jpg" alt="Ford Mustang after wash" loading="lazy" decoding="async"></figure>
        <figure class="reveal"><img src="img/pc03.jpg" alt="Ford Escape after wash" loading="lazy" decoding="async"></figure>
        <figure class="reveal"><img src="img/pc04.jpg" alt="GMC Acadia after wash" loading="lazy" decoding="async"></figure>
        <figure class="reveal"><img src="img/pc05.jpg" alt="Hyundai Santa Fe after wash" loading="lazy" decoding="async"></figure>
        <figure class="reveal"><img src="img/pc06.jpg" alt="GMC Acadia interior cleaned" loading="lazy" decoding="async"></figure>
        <figure class="reveal"><img src="img/pc07.jpg" alt="Ford Explorer interior cleaned" loading="lazy" decoding="async"></figure>
        <figure class="reveal"><img src="img/pc08.jpg" alt="Tesla Model 3 interior cleaned" loading="lazy" decoding="async"></figure>
        <figure class="reveal"><img src="img/pc09.jpg" alt="Ford Mustang interior cleaned" loading="lazy" decoding="async"></figure>
      </div>
    </div>
  </section>

  <section id="plans" style="padding-top:0">
    <div class="wrap">
      <p class="kicker reveal" data-i18n="pc_plans_kicker"></p>
      <h2 class="h2 reveal" data-i18n="pc_plans_title"></h2>
      <div class="plans" id="plansGrid"></div>
    </div>
  </section>

  <section class="final" id="book">
    <div class="wrap">
      <h2 class="h2 reveal" data-i18n="pc_final_title"></h2>
      <p class="reveal" data-i18n="pc_final_sub"></p>
      <form class="form reveal" id="leadForm">
        <input name="name" required data-i18n-ph="f_name" autocomplete="name">
        <input name="car" required data-i18n-ph="f_car">
        <input name="zip" inputmode="numeric" maxlength="10" data-i18n-ph="f_zip" autocomplete="postal-code">
        <button class="btn btn-wa" type="submit"><svg width="18" height="18"><use href="#wa"/></svg><span data-i18n="f_send"></span></button>
      </form>
      <p class="alt-sms reveal"><a href="#" class="btn btn-sms js-sms"><svg width="18" height="18"><use href="#sms"/></svg><span data-i18n="f_sms"></span></a></p>
    </div>
  </section>
